micronaut:
  server:
    port: ${PORT:8085}
    cors:
      enabled: true
      configurations:
        all:
          allowed-origins:
            - ${FRONTEND_ORIGIN:`http://localhost:5173`}
            - http://127.0.0.1:5173

datasources:
  default:
    url: "${DB_URL:`jdbc:postgresql://localhost:5432/LinkeTinder_BD`}"
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver