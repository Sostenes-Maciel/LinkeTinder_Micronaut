micronaut:
  application:
    name: ms-vagas

  server:
    port: ${PORT:8087}
    cors:
      enabled: true

datasources:
  default:
    url: jdbc:postgresql://localhost:5432/LinkeTinder_BD
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topics:
    novas-vagas: ${KAFKA_TOPIC_NOVAS_VAGAS:linketinder.vagas.criadas}