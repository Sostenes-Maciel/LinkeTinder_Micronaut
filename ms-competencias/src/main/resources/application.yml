micronaut:
  application:
    name: ms-competencias
  server:
    port: ${PORT:8086}
    cors:
      enabled: true
      configurations:
        default:
          allowed-origins:
            - ${FRONTEND_ORIGIN:http://localhost:5173}

datasources:
  default:
    url: jdbc:postgresql://localhost:5432/LinkeTinder_BD
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver