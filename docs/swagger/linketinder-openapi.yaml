VagaCreateInput:
  type: object
  required:
    - cnpjEmpresa
    - titulo
    - pais
    - estado
    - descricao
    - areaAtuacao
    - competencias
  properties:
    cnpjEmpresa:
      type: string
      maxLength: 18
      example: "12.345.678/0001-99"
    titulo:
      type: string
      maxLength: 255
      example: "Desenvolvedor Backend Groovy/Micronaut"
    pais:
      type: string
      maxLength: 100
      example: "Brasil"
    estado:
      type: string
      maxLength: 100
      example: "Pernambuco"
    descricao:
      type: string
      example: "Desenvolvimento de microsservicos RESTful e mensageria com Kafka."
    areaAtuacao:
      type: string
      maxLength: 150
      example: "Tecnologia da Informacao"
    competencias:
      type: array
      minItems: 1
      items:
        type: string
      example: ["Groovy", "Micronaut", "PostgreSQL"]

  VagaUpdateInput:
    type: object
    required:
      - titulo
      - pais
      - estado
      - descricao
      - areaAtuacao
    properties:
      titulo:
        type: string
        maxLength: 255
        example: "Desenvolvedor Backend Pleno"
      pais:
        type: string
        maxLength: 100
        example: "Brasil"
      estado:
        type: string
        maxLength: 100
        example: "Pernambuco"
      descricao:
        type: string
        example: "Atuacao em arquitetura orientada a eventos."
      areaAtuacao:
        type: string
        maxLength: 150
        example: "Engenharia de Software"
      competencias:
        type: array
        minItems: 1
        description: Opcional na atualizacao; se informado, substitui as competencias da vaga
        items:
          type: string
        example: ["Groovy", "Kafka", "Docker"]

  VagaResponse:
    type: object
    properties:
      idVaga:
        type: integer
        example: 1
      cnpjEmpresa:
        type: string
        example: "12.345.678/0001-99"
      titulo:
        type: string
        example: "Desenvolvedor Backend Groovy/Micronaut"
      pais:
        type: string
        example: "Brasil"
      estado:
        type: string
        example: "Pernambuco"
      descricao:
        type: string
        example: "Desenvolvimento de microsservicos RESTful e mensageria com Kafka."
      areaAtuacao:
        type: string
        example: "Tecnologia da Informacao"
      competencias:
        type: array
        items:
          type: string
        example: ["Groovy", "Micronaut", "PostgreSQL"]