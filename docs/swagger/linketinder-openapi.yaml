openapi: 3.0.3
info:
  title: Linketinder API
  description: Contrato unificado das APIs RESTful publicas dos microsservicos do Linketinder.
  version: 1.0.0

servers:
  - url: http://localhost:8085
    description: ms-cadastro — Cadastro de Candidatos e Empresas
  - url: http://localhost:8086
    description: ms-competencias — CRUD e Vinculos de Competencias
  - url: http://localhost:8087
    description: ms-vagas — CRUD de Vagas
  - url: http://localhost:8088
    description: ms-curtidas-matches — Curtidas e Matches

tags:
  - name: Cadastro
    description: Endpoints do ms-cadastro (porta 8085)
  - name: Competencias
    description: Endpoints do ms-competencias (porta 8086)
  - name: Vagas
    description: Endpoints do ms-vagas (porta 8087)
  - name: Curtidas e Matches
    description: Endpoints do ms-curtidas-matches (porta 8088)

paths:
  /api/candidatos:
    post:
      tags: [Cadastro]
      summary: Cadastra candidato
      description: Cria um novo registro de candidato com validacao de campos obrigatorios, faixa etaria (18 a 120 anos) e lista opcional de competencias.
      servers:
        - url: http://localhost:8085
          description: ms-cadastro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidatoInput'
      responses:
        '201':
          description: Candidato cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroCriadoResponse'
              example:
                tipo: candidato
                identificador: "123.456.789-00"
        '422':
          description: Dados de entrada invalidos ou fora das regras de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: idade deve estar entre 18 e 120 anos.
        '409':
          description: Conflito de duplicidade (CPF ou e-mail ja cadastrado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: Ja existe um cadastro com esse identificador ou email.
        '500':
          description: Erro interno ao persistir o cadastro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: Falha ao persistir o cadastro.

  /api/empresas:
    post:
      tags: [Cadastro]
      summary: Cadastra empresa
      description: Cria um novo registro de empresa recrutadora com validacao de campos obrigatorios e lista opcional de competencias.
      servers:
        - url: http://localhost:8085
          description: ms-cadastro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaInput'
      responses:
        '201':
          description: Empresa cadastrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroCriadoResponse'
              example:
                tipo: empresa
                identificador: "12.345.678/0001-99"
        '422':
          description: Dados de entrada invalidos ou fora das regras de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: email invalido.
        '409':
          description: Conflito de duplicidade (CNPJ ou e-mail ja cadastrado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: Ja existe um cadastro com esse identificador ou email.
        '500':
          description: Erro interno ao persistir o cadastro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: Falha ao persistir o cadastro.

  /api/competencias:
    get:
      tags: [Competencias]
      summary: Lista competencias
      description: Retorna todas as competencias cadastradas no sistema.
      servers:
        - url: http://localhost:8086
          description: ms-competencias
      responses:
        '200':
          description: Lista de competencias retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetenciaItem'
        '500':
          description: Erro interno ao consultar competencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
    post:
      tags: [Competencias]
      summary: Cadastra nova competencia
      description: Cria uma nova competencia tecnica ou comportamental (limite de 255 caracteres).
      servers:
        - url: http://localhost:8086
          description: ms-competencias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetenciaInput'
      responses:
        '201':
          description: Competencia criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetenciaItem'
        '422':
          description: Nome da competencia ausente ou acima de 255 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: nome e obrigatorio e deve ser texto.
        '409':
          description: Competencia ja cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: Registro duplicado de competencia ou vinculo.
        '500':
          description: Erro interno ao persistir competencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /api/competencias/candidatos/consulta-lote:
    post:
      tags: [Competencias]
      summary: Consulta competencias por lote de candidatos
      description: Recebe uma lista de ate 500 CPFs (11 digitos cada) e retorna um mapa agrupando as competencias de cada candidato.
      servers:
        - url: http://localhost:8086
          description: ms-competencias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaLoteCandidatosInput'
      responses:
        '200':
          description: Mapa de competencias indexado por CPF
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/CompetenciaItem'
              example:
                "12345678901":
                  - id: 1
                    nome: Groovy
                  - id: 2
                    nome: Micronaut
        '422':
          description: Lista de CPFs invalida, mal formatada ou acima de 500 itens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: cpfs[0] deve conter exatamente 11 digitos.
        '500':
          description: Erro interno na consulta em lote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /api/competencias/candidatos/{cpf}:
    get:
      tags: [Competencias]
      summary: Lista competencias de um candidato
      servers:
        - url: http://localhost:8086
          description: ms-competencias
      parameters:
        - name: cpf
          in: path
          required: true
          description: CPF do candidato (ate 14 caracteres)
          schema:
            type: string
            maxLength: 14
            example: "12345678901"
      responses:
        '200':
          description: Lista de competencias vinculadas ao candidato
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetenciaItem'
        '422':
          description: CPF invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /api/competencias/candidatos:
    post:
      tags: [Competencias]
      summary: Vincula competencia a candidato
      servers:
        - url: http://localhost:8086
          description: ms-competencias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VinculoCompetenciaCandidatoInput'
      responses:
        '201':
          description: Competencia vinculada ao candidato com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VinculoCompetenciaCandidatoResponse'
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '409':
          description: Vinculo ja existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: Registro duplicado de competencia ou vinculo.
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /api/competencias/empresas/{cnpj}:
    get:
      tags: [Competencias]
      summary: Lista competencias de uma empresa
      servers:
        - url: http://localhost:8086
          description: ms-competencias
      parameters:
        - name: cnpj
          in: path
          required: true
          description: CNPJ da empresa (ate 18 caracteres)
          schema:
            type: string
            maxLength: 18
            example: "12345678000199"
      responses:
        '200':
          description: Lista de competencias vinculadas a empresa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetenciaItem'
        '422':
          description: CNPJ invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /api/competencias/empresas:
    post:
      tags: [Competencias]
      summary: Vincula competencia a empresa
      servers:
        - url: http://localhost:8086
          description: ms-competencias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VinculoCompetenciaEmpresaInput'
      responses:
        '201':
          description: Competencia vinculada a empresa com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VinculoCompetenciaEmpresaResponse'
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '409':
          description: Vinculo ja existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: Registro duplicado de competencia ou vinculo.
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /api/competencias/vagas/{idVaga}:
    get:
      tags: [Competencias]
      summary: Lista competencias de uma vaga
      servers:
        - url: http://localhost:8086
          description: ms-competencias
      parameters:
        - name: idVaga
          in: path
          required: true
          description: Identificador inteiro positivo da vaga
          schema:
            type: integer
            minimum: 1
            example: 10
      responses:
        '200':
          description: Lista de competencias vinculadas a vaga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetenciaItem'
        '422':
          description: idVaga menor ou igual a zero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: idVaga deve ser maior que zero.
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /api/competencias/vagas:
    post:
      tags: [Competencias]
      summary: Vincula competencia a vaga
      servers:
        - url: http://localhost:8086
          description: ms-competencias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VinculoCompetenciaVagaInput'
      responses:
        '201':
          description: Competencia vinculada a vaga com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VinculoCompetenciaVagaResponse'
        '422':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '409':
          description: Vinculo ja existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                mensagem: Registro duplicado de competencia ou vinculo.
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

components:
  schemas:
    CandidatoInput:
      type: object
      required:
        - cpf
        - nome
        - email
        - pais
        - estado
        - cep
        - descricao
        - idade
      properties:
        cpf:
          type: string
          maxLength: 14
          example: "123.456.789-00"
        nome:
          type: string
          maxLength: 255
          example: "Joao Silva"
        email:
          type: string
          format: email
          maxLength: 255
          example: "joao.silva@email.com"
        pais:
          type: string
          maxLength: 100
          example: "Brasil"
        estado:
          type: string
          maxLength: 100
          example: "Pernambuco"
        cep:
          type: string
          maxLength: 20
          example: "55290-000"
        descricao:
          type: string
          example: "Desenvolvedor backend com foco em Groovy, Micronaut e PostgreSQL."
        idade:
          type: integer
          minimum: 18
          maximum: 120
          example: 26
        competencias:
          type: array
          items:
            type: string
          example: ["Groovy", "Micronaut", "PostgreSQL"]

    EmpresaInput:
      type: object
      required:
        - cnpj
        - nome
        - email
        - pais
        - estado
        - cep
        - descricao
      properties:
        cnpj:
          type: string
          maxLength: 18
          example: "12.345.678/0001-99"
        nome:
          type: string
          maxLength: 255
          example: "Pastelsoft"
        email:
          type: string
          format: email
          maxLength: 255
          example: "pastelzinho@pastelsoft.com.br"
        pais:
          type: string
          maxLength: 100
          example: "Brasil"
        estado:
          type: string
          maxLength: 100
          example: "Pernambuco"
        cep:
          type: string
          maxLength: 20
          example: "55290-000"
        descricao:
          type: string
          example: "Empresa de desenvolvimento de software e solucoes em nuvem."
        competencias:
          type: array
          items:
            type: string
          example: ["Groovy", "Docker", "Kafka"]

    CadastroCriadoResponse:
      type: object
      properties:
        tipo:
          type: string
          enum: [candidato, empresa]
        identificador:
          type: string
          description: CPF do candidato ou CNPJ da empresa cadastrada

    CompetenciaInput:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string
          maxLength: 255
          example: "Groovy"

    CompetenciaItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: "Groovy"

    ConsultaLoteCandidatosInput:
      type: object
      required:
        - cpfs
      properties:
        cpfs:
          type: array
          maxItems: 500
          description: Lista de CPFs (11 digitos numericos cada)
          items:
            type: string
            example: "12345678901"
          example: ["12345678901", "98765432100"]

    VinculoCompetenciaCandidatoInput:
      type: object
      required:
        - cpfCandidato
        - nome
      properties:
        cpfCandidato:
          type: string
          maxLength: 14
          example: "12345678901"
        nome:
          type: string
          maxLength: 255
          example: "Groovy"

    VinculoCompetenciaCandidatoResponse:
      type: object
      properties:
        cpfCandidato:
          type: string
          example: "12345678901"
        competencia:
          type: string
          example: "Groovy"

    VinculoCompetenciaEmpresaInput:
      type: object
      required:
        - cnpjEmpresa
        - nome
      properties:
        cnpjEmpresa:
          type: string
          maxLength: 18
          example: "12345678000199"
        nome:
          type: string
          maxLength: 255
          example: "Micronaut"

    VinculoCompetenciaEmpresaResponse:
      type: object
      properties:
        cnpjEmpresa:
          type: string
          example: "12345678000199"
        competencia:
          type: string
          example: "Micronaut"

    VinculoCompetenciaVagaInput:
      type: object
      required:
        - idVaga
        - nome
      properties:
        idVaga:
          type: integer
          minimum: 1
          example: 10
        nome:
          type: string
          maxLength: 255
          example: "PostgreSQL"

    VinculoCompetenciaVagaResponse:
      type: object
      properties:
        idVaga:
          type: integer
          example: 10
        competencia:
          type: string
          example: "PostgreSQL"

    ErroResponse:
      type: object
      properties:
        mensagem:
          type: string